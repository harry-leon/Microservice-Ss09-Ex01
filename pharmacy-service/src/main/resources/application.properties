spring.application.name=pharmacy-service
server.port=8081

# Import config from Config Server running at port 8888
# optional:configserver: allows application to startup even if config server is temporarily unavailable or in dev/test
spring.config.import=optional:configserver:http://localhost:8888

# Fallback defaults in case config-server is unreachable during local test
spring.datasource.url=jdbc:h2:mem:pharmacy_fallback_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Fallback values for branch info
app.branch-name=Nha Thuoc Mac Dinh (Local Fallback)
app.hotline=19000000

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,env,refresh
